<!doctype html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08ae38"><title>হাসপাতাল | হাটহাজারী সিটি গাইড</title><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#f4f8f5;color:#183326;font-family:'Hind Siliguri',sans-serif}.head{background:linear-gradient(110deg,#08b638,#087f2d);color:white;padding:16px max(16px,calc((100vw - 760px)/2)) 22px}.back{border:0;background:#ffffff25;color:white;border-radius:10px;padding:8px 12px;font-size:14px}.title{display:flex;align-items:center;gap:13px;margin-top:17px}.ico{width:52px;height:52px;border-radius:15px;background:#ffffff26;display:grid;place-items:center;font-size:29px}.title h1{font-size:24px;margin:0}.title p{margin:0;font-size:12px;opacity:.85}.wrap{max-width:760px;margin:auto;padding:18px 14px 35px}.search{width:100%;border:1px solid #dce9df;background:white;border-radius:12px;padding:12px 14px;font:inherit;outline-color:#08ae38;margin-bottom:15px}.list{display:grid;gap:11px}.item{background:white;border:1px solid #dfebe2;border-radius:13px;padding:15px;box-shadow:0 3px 12px #143c1b08}.item h3{margin:0 0 5px;font-size:17px}.item p{margin:3px 0;color:#687b70;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actions a{background:#e8f8ed;color:#078c32;text-decoration:none;padding:7px 11px;border-radius:8px;font-size:12px}.empty{background:#fff;border:1px dashed #cbded0;border-radius:13px;padding:28px;text-align:center;color:#718078}.foot{text-align:center;color:#839087;font-size:11px;padding:20px}
</style></head><body><header class="head"><button class="back" onclick="history.length>1?history.back():location.href='../index.html'">← ফিরে যান</button><div class="title"><span class="ico">🏥</span><div><h1>হাসপাতাল</h1><p>হাটহাজারী সিটি গাইড · Hospitals</p></div></div></header><main class="wrap"><input class="search" id="q" placeholder="হাসপাতাল খুঁজুন..." oninput="render()"><div class="list" id="list"></div></main><div class="foot">হাটহাজারী সিটি গাইড · আপনার শহর, আপনার ঠিকানা</div>
<script>
const CATEGORY="হাসপাতাল";
const SEED=[];
function esc(s){return String(s||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function render(){let records=[];try{records=JSON.parse(localStorage.getItem('hc_records')||'[]')}catch(e){}let q=(document.getElementById('q').value||'').toLowerCase();let rows=[...SEED,...records.filter(x=>x.approved&&x.category===CATEGORY)].filter(x=>(x.name+' '+x.address+' '+x.description).toLowerCase().includes(q));document.getElementById('list').innerHTML=rows.length?rows.map(p=>'<article class="item"><h3>'+esc(p.name)+'</h3><p>📍 '+esc(p.address||'ঠিকানা যোগ করা হয়নি')+'</p><p>☎ '+esc(p.phone||'ফোন নম্বর দেওয়া হয়নি')+'</p><p>'+esc(p.description||'')+'</p><div class="actions">'+(p.phone?'<a href="tel:'+esc(p.phone)+'">কল করুন</a>':'')+'<a target="_blank" href="'+esc(p.map_url||('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent((p.name||'')+' '+(p.address||''))))+'">ম্যাপ দেখুন</a></div></article>').join(''):'<div class="empty">এই ক্যাটাগরিতে এখনো কোনো তথ্য যুক্ত হয়নি।<br>প্রতিষ্ঠান যুক্ত করতে মূল অ্যাপের Business Registration ব্যবহার করুন।</div>'}
render();
</script></body></html>
