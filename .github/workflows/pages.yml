name: Build Hathazari City Guide

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate app files
        run: |
          test -s index.html
          test -s manifest.webmanifest
          test -s service-worker.js
          test -s supabase/schema.sql
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Checker(HTMLParser):
              pass
          html = Path("index.html").read_text(encoding="utf-8")
          Checker().feed(html)
          print("HTML parsed successfully")
          print(f"index.html: {len(html)} characters")
          PY
      - name: Package web app
        run: |
          mkdir -p dist
          cp index.html manifest.webmanifest service-worker.js dist/
          if [ -d assets ]; then cp -r assets dist/; fi
          if [ -d icons ]; then cp -r icons dist/; fi
          test -s dist/index.html
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hathazari-city-web-build
          path: dist/
          if-no-files-found: error
